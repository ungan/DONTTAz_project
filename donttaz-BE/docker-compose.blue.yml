services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: donttaz-api-blue
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - donttaz-net

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: donttaz-ai-blue
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - donttaz-net

networks:
  donttaz-net:
    external: true
    name: donttaz-net
