# DataSource Configuration (H2 In-Memory for Testing)
# 환경 변수 의존성을 끊고 CI 환경에서도 독립적으로 돌도록 H2를 사용합니다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
# create-drop: 테스트 시작 시 생성하고, 종료 시 테이블을 삭제합니다.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# JWT Configuration (Test values)
jwt.secret=test-secret-key-for-jwt-signature-at-least-256-bits-long-test-only
jwt.access-expiration=3600000
jwt.refresh-expiration=1209600000

# finAPI Mock (not used in this test)
fin-api.base-url=http://localhost:8080
fin-api.api-key=test-api-key

# Redis Configuration (Test values - not used due to MockitoBean)
spring.data.redis.host=localhost
spring.data.redis.port=6379
