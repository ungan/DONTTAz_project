# DataSource Configuration (MySQL for Testing)
# 환경 변수에서 값을 읽어옵니다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
# update: 엔티티 변경 시 테이블 구조를 자동으로 업데이트합니다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# JWT Configuration (Test values)
jwt.secret=test-secret-key-for-jwt-signature-at-least-256-bits-long-test-only
jwt.access-expiration=3600000
jwt.refresh-expiration=1209600000

# finAPI Mock (not used in this test)
fin-api.base-url=http://localhost:8080
fin-api.api-key=test-api-key

# Redis Configuration (Test values - not used due to MockitoBean)
spring.data.redis.host=localhost
spring.data.redis.port=6379
