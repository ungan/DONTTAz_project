spring.application.name=Donttaz
spring.profiles.default=local

# Proxy Header Settings: Nginx 등 리버스 프록시 헤더(X-Forwarded-*) 처리 전략
server.forward-headers-strategy=native

# ===== Web MVC Settings (For 404 Global Exception Handling) =====
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# ===== JPA Common Settings =====
# Naming Strategy: camelCase -> snake_case 자동 변환
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# Timezone: DB 통신 시 Asia/Seoul 타임존 사용
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# Open-In-View: LazyInitializationException 방지를 위해 명시적으로 비활성화
spring.jpa.open-in-view=false

# Shared finAPI defaults. Sensitive values must come from environment variables or secret storage.
fin-api.base-url=${FIN_API_BASE_URL:}
fin-api.institution-code=${FIN_API_INSTITUTION_CODE:00100}
fin-api.fintech-app-no=${FIN_API_FINTECH_APP_NO:001}
fin-api.one-won-auth-text=${FIN_API_ONE_WON_AUTH_TEXT:DONTTAZ}
fin-api.one-won-expiration-seconds=${FIN_API_ONE_WON_EXPIRATION_SECONDS:300}

# JWT Configuration
# At least 32 characters (256 bits)
jwt.secret=donttaz-secret-key-for-jwt-signature-at-least-256-bits-long
jwt.access-expiration=1800000
jwt.refresh-expiration=1209600000

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD:}

# PortOne V2 Configuration
portone.api-secret=${API_SECRET:}

# Vault Configuration
vault.admin-user-id=${ADMIN_USER_ID}
vault.admin-account-no=${ADMIN_ACCOUNT_NO}
vault.default-base-rate=5.0
vault.default-penalty-rate=0.1

# AI Server Configuration
ai.server.url=${AI_SERVER_URL:http://localhost:8000}
ai.analysis.endpoint=${AI_ANALYSIS_ENDPOINT:/api/v1/predict}
ai.planning.endpoint=${AI_PLANNING_ENDPOINT:/api/v1/plan}

# ===== Actuator & Prometheus Configuration =====
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true