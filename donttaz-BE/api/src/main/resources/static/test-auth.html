<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>포트원 V2 본인인증 테스트</title>
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --line: #dbe2ea;
            --primary: #0f766e;
            --primary-pressed: #115e59;
            --success-bg: #f0fdf4;
            --success-text: #166534;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg);
            overscroll-behavior-y: contain;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            padding: max(24px, env(safe-area-inset-top)) 16px
                max(24px, calc(env(safe-area-inset-bottom) + 16px));
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
        }

        .page {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        .container {
            background: var(--card);
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            background: #e6fffb;
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
        }

        h1 {
            margin: 16px 0 12px;
            font-size: 28px;
            line-height: 1.25;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .actions {
            margin-top: 24px;
        }

        button,
        a.button-link {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 16px 18px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }

        button {
            background: var(--primary);
            color: #ffffff;
            cursor: pointer;
        }

        button:active {
            background: var(--primary-pressed);
        }

        button[disabled] {
            opacity: 0.6;
            cursor: not-allowed;
        }

        a.button-link {
            display: none;
            margin-top: 12px;
            background: #1d4ed8;
            color: #ffffff;
        }

        #result {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border: 1px solid #bbf7d0;
            border-radius: 14px;
            background: var(--success-bg);
            color: var(--success-text);
            line-height: 1.6;
            word-break: break-all;
        }

        code {
            display: inline-block;
            margin-top: 8px;
            color: var(--text);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        }
    </style>
</head>
<body>
<main class="page">
    <section class="container">
        <span class="eyebrow">PortOne Identity</span>
        <h1>본인인증 테스트</h1>
        <p>
            버튼을 누르면 포트원 본인인증이 시작됩니다.
            모바일 브라우저에서 화면이 밀리지 않도록 고정형 레이아웃으로 구성했습니다.
        </p>

        <div class="actions">
            <button id="requestButton" type="button" onclick="requestCert()">
                본인인증 시작
            </button>
            <a id="returnToApp" class="button-link" href="#">
                앱으로 돌아가기
            </a>
        </div>

        <div id="result">
            <strong>인증 성공</strong><br>
            아래 ID를 확인한 뒤 자동 복귀가 되지 않으면 버튼으로 앱에 돌아가세요.<br>
            <code id="certId"></code>
        </div>
    </section>
</main>

<script>
    const requestButton = document.getElementById("requestButton");
    const resultBox = document.getElementById("result");
    const certIdElement = document.getElementById("certId");
    const returnToAppLink = document.getElementById("returnToApp");

    function lockScrollTop() {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
    }

    function setPendingState(isPending) {
        requestButton.disabled = isPending;
        requestButton.textContent = isPending ? "인증창 여는 중..." : "본인인증 시작";
    }

    function createIdentityVerificationId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
            return `cert-${window.crypto.randomUUID()}`;
        }

        if (window.crypto && typeof window.crypto.getRandomValues === "function") {
            const bytes = new Uint8Array(16);
            window.crypto.getRandomValues(bytes);
            const randomHex = Array.from(bytes, (byte) =>
                byte.toString(16).padStart(2, "0")
            ).join("");
            return `cert-${randomHex}`;
        }

        return `cert-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function getRedirectUri() {
        const params = new URLSearchParams(window.location.search);
        return params.get("redirectUri");
    }

    function getBridgeRedirectUrl() {
        const redirectUri = getRedirectUri();

        if (!redirectUri) {
            return window.location.origin + window.location.pathname;
        }

        return `${window.location.origin}${window.location.pathname}?${new URLSearchParams({
            redirectUri,
        }).toString()}`;
    }

    function getResultFromCurrentUrl() {
        const params = new URLSearchParams(window.location.search);

        return {
            identityVerificationId: params.get("identityVerificationId"),
            code: params.get("code"),
            message: params.get("message"),
        };
    }

    function redirectToApp(values) {
        const redirectUri = getRedirectUri();

        if (!redirectUri) {
            return false;
        }

        const query = new URLSearchParams(values).toString();
        const nextUrl = query ? `${redirectUri}?${query}` : redirectUri;

        returnToAppLink.href = nextUrl;
        returnToAppLink.style.display = "block";

        setTimeout(() => {
            window.location.href = nextUrl;
        }, 150);

        return true;
    }

    async function requestCert() {
        lockScrollTop();
        setPendingState(true);

        try {
            const response = await PortOne.requestIdentityVerification({
                storeId: "store-e9d6a7c5-fb1d-4094-a7b6-c2fe37b55e8a",
                identityVerificationId: createIdentityVerificationId(),
                channelKey: "channel-key-f0acd432-a0ca-4c76-a481-1a219e2fc9a5",
                redirectUrl: getBridgeRedirectUrl(),
                windowType: {
                    pc: "POPUP",
                    mobile: "REDIRECTION",
                },
            });

            if (response.code != null) {
                redirectToApp({
                    code: response.code,
                    message: response.message ?? "본인인증에 실패했습니다.",
                });
                alert(`인증 실패: ${response.message}`);
                return;
            }

            resultBox.style.display = "block";
            certIdElement.textContent = response.identityVerificationId;

            redirectToApp({
                identityVerificationId: response.identityVerificationId,
            });
        } catch (error) {
            console.error(error);
            redirectToApp({
                message: error?.message ?? "본인인증 처리 중 오류가 발생했습니다.",
            });
            alert(`오류 발생: ${error?.message}`);
        } finally {
            setPendingState(false);
            lockScrollTop();
        }
    }

    (function handleRedirectResult() {
        const { identityVerificationId, code, message } = getResultFromCurrentUrl();

        if (identityVerificationId) {
            resultBox.style.display = "block";
            certIdElement.textContent = identityVerificationId;
            redirectToApp({ identityVerificationId });
            return;
        }

        if (message) {
            redirectToApp({
                code,
                message,
            });
        }
    })();

    window.addEventListener("load", lockScrollTop);
    window.addEventListener("pageshow", lockScrollTop);
    window.addEventListener("resize", lockScrollTop);
</script>
</body>
</html>
