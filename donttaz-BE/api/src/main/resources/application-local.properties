# H2
spring.datasource.url=jdbc:h2:mem:donttaz;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# finAPI
# Load BE/api/.env with the IDE .env files plugin when launching the local profile.
# Set the already-issued key in FIN_API_API_KEY before starting the app.
fin-api.api-key=${FIN_API_API_KEY:}
