# MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=2

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# finAPI
# Load BE/api/.env with the IDE .env files plugin when launching the local profile.
# Set the already-issued key in FIN_API_API_KEY before starting the app.
fin-api.api-key=${FIN_API_API_KEY:}
fin-api.mock-user-key=${FIN_API_MOCK_USER_KEY:}
