services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: donttaz-api-green
    ports:
      - "127.0.0.1:8082:8080"
    restart: "no"
    env_file:
      - .env
    networks:
      - donttaz-net

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: donttaz-ai-green
    ports:
      - "127.0.0.1:8002:8000"
    restart: "no"
    env_file:
      - .env
    networks:
      - donttaz-net

networks:
  donttaz-net:
    external: true
    name: donttaz-net
