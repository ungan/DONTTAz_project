services:
  nginx:
    image: nginx:stable-alpine
    container_name: donttaz-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/service-env.inc:/etc/nginx/conf.d/service-env.inc
      - ./nginx/api-blue.inc:/etc/nginx/conf.d/api-blue.inc:ro
      - ./nginx/api-green.inc:/etc/nginx/conf.d/api-green.inc:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - donttaz-net
    restart: unless-stopped

networks:
  donttaz-net:
    external: true
    name: donttaz-net
