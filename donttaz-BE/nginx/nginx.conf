# 동적으로 포트가 변하는 service-env.inc 파일을 불러옵니다.
include /etc/nginx/conf.d/service-env.inc;

server {
    server_name j14c104.p.ssafy.io;

    # 1. Spring Boot (메인 뱅킹 API) 라우팅
    location /api/ {
        proxy_pass http://donttaz-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. FastAPI (AI 모델 API) 라우팅
    location /ai/ {
        proxy_pass http://donttaz-ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Swagger UI (Spring Boot)
    location /swagger-ui/ {
        proxy_pass http://donttaz-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v2/api-docs {
        proxy_pass http://donttaz-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v3/api-docs {
        proxy_pass http://donttaz-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. FastAPI Docs
    location /docs {
        proxy_pass http://donttaz-ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://donttaz-ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/j14c104.p.ssafy.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/j14c104.p.ssafy.io/privkey.pem; # managed by Certbot
    # include /etc/letsencrypt/options-ssl-nginx.conf; # 컨테이너 내부 경로 확인 필요 시 주석 해제하여 파일 마운트
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # 위와 동일

}

server {
    if ($host = j14c104.p.ssafy.io) {
        return 301 https://$host$request_uri;
    }


    listen 80;
    server_name j14c104.p.ssafy.io;
    return 404;


}
