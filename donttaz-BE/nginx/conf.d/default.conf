# nginx/conf.d/default.conf

# Blue-Green 배포용 변수 파일을 불러옵니다.
# Jenkins에서 배포 후 이 파일을 수정하고 Nginx를 리로드하여 타겟을 전환합니다.
include /etc/nginx/conf.d/service-env.inc;

server {
    server_name j14c104.p.ssafy.io;

    # 1. Spring Boot (메인 뱅킹 API) 라우팅
    location /api/ {
        proxy_pass http://donttaz-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # 프로토콜(HTTP/HTTPS) 전달
    }

    # 2. FastAPI (AI 모델 API) 라우팅
    location /internal/ai/ {
        proxy_pass http://donttaz-ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # 프로토콜(HTTP/HTTPS) 전달
    }

    # 3. Swagger UI (Spring Boot)
    location /swagger-ui/ {
        proxy_pass http://donttaz-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # Swagger UI용 프로토콜 전달
    }

    location /v2/api-docs {
        proxy_pass http://donttaz-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # 프로토콜 추가
    }

    location /v3/api-docs {
        proxy_pass http://donttaz-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # 프로토콜 추가
    }

    # 4. FastAPI Docs
    location /docs {
        proxy_pass http://donttaz-ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # 프로토콜 추가
    }

    location /openapi.json {
        proxy_pass http://donttaz-ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # 프로토콜 추가
    }
    
    # 5. Jenkins Webhook Trigger 라우팅
    location /project {
        # 젠킨스가 호스트의 127.0.0.1 에만 바인딩되어 있어 외부망/도커망에서 IP로 접근이 불가능
        # 젠킨스도 Nginx와 같은 donttaz-net 도커 네트워크에 속해 있으므로, 
        # 컨테이너 이름(jenkins)과 내부 포트(8080)를 사용하여 직접 연결
        proxy_pass http://jenkins:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /test-auth.html {
        proxy_pass http://donttaz-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/j14c104.p.ssafy.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/j14c104.p.ssafy.io/privkey.pem; # managed by Certbot
}

server {
    if ($host = j14c104.p.ssafy.io) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name j14c104.p.ssafy.io;
    return 404;
}
